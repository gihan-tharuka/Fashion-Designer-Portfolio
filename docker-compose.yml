services:
  postgres:
    image: postgres:16-alpine
    container_name: lumene-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lumene_portfolio
      POSTGRES_USER: lumene_user
      POSTGRES_PASSWORD: lumene_password
    ports:
      - "5432:5432"
    volumes:
      - lumene-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumene_user -d lumene_portfolio"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  lumene-postgres-data:
